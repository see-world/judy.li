title: Judy Li
email: cxlee2010@163.com

description: >
  Technical Documentation Leader, AI Explorer, and lifelong learner.
  Sharing insights on technical communication, knowledge management,
  AI agents, MCP, and the future of intelligent content.

github_username: see-world

minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes"

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

timezone: Asia/Hong_Kong

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Judy Li"
  avatar: "/assets/images/profile.jpg"
  bio: "Head of Technical Documentation China | AI Explorer | Knowledge Management Advocate"
  location: "Guangdong, China"

  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/judylcx/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/see-world"

    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:cxlee2010@163.com"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/judylcx/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/see-world"

defaults:
  # Blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  # Pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
