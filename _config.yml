title: "Judy Li"
email: "cxlee2010@163.com"

description: >
  Knowledge Governance, Documentation Leadership,
  Content Governance, and AI-powered Knowledge Systems.

repository: "see-world/judy.li"

github_username: "see-world"

github:
  repository_url: "https://github.com/see-world/judy.li"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "mint"

search: true
markdown: kramdown
timezone: "Asia/Hong_Kong"

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Judy Li"
  avatar: "/assets/images/judy-li.jpg"
  bio: "Knowledge Governance • Documentation Leadership • AI Transformation"

  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:cxlee2010@163.com"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/judylcx/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/see-world"

collections:
  governance:
    output: true
    permalink: /governance/:path/

  ideas:
    output: true
    permalink: /ideas/:path/

  frameworks:
    output: true
    permalink: /frameworks/:path/

  ai:
    output: true
    permalink: /ai/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      toc: true
      read_time: true

  - scope:
      path: ""
      type: governance
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: ideas
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: frameworks
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: ai
    values:
      layout: single
      author_profile: true

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

permalink: /:year/:month/:day/:title/

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:cxlee2010@163.com"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/judylcx/"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/see-world"
